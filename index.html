<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Los Pelletos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#d4a843;--gold2:#f0d078;--dark:#0a0a0f;--dark2:#12121a;--dark3:#1a1a28}
body{background:var(--dark);color:#e8e0d0;font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden;min-height:100vh}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:linear-gradient(180deg,rgba(10,10,15,.98),rgba(10,10,15,.92));backdrop-filter:blur(20px);border-bottom:1px solid rgba(212,168,67,.2)}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;padding:0 16px;height:60px}
.nav-logo{font-family:Georgia,serif;font-size:20px;color:var(--gold);font-weight:bold;letter-spacing:2px;margin-right:auto}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 18px;color:rgba(232,224,208,.5);font-size:14px;font-weight:600;cursor:pointer;border-radius:8px 8px 0 0;transition:all .3s;white-space:nowrap;border:none;background:none;position:relative}
.tab:hover{color:rgba(232,224,208,.8)}
.tab.active{color:var(--gold2);background:rgba(212,168,67,.08)}
.tab.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);border-radius:2px}

/* PAGES */
.page{display:none;padding-top:70px;min-height:100vh;animation:fadeUp .4s ease}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ACCUEIL */
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 70px);text-align:center;padding:20px;background:radial-gradient(ellipse at center,rgba(212,168,67,.06) 0%,transparent 60%)}
.logo-container{position:relative;width:min(320px,70vw);height:min(354px,77vw);margin-bottom:30px;perspective:800px}
.logo-3d{width:100%;height:100%;animation:float3d 6s ease-in-out infinite;filter:drop-shadow(0 20px 60px rgba(212,168,67,.4)) drop-shadow(0 0 80px rgba(212,168,67,.15));transition:transform .3s}
@keyframes float3d{
0%,100%{transform:rotateY(-5deg) rotateX(2deg) translateY(0)}
25%{transform:rotateY(5deg) rotateX(-2deg) translateY(-12px)}
50%{transform:rotateY(-3deg) rotateX(3deg) translateY(-6px)}
75%{transform:rotateY(4deg) rotateX(-1deg) translateY(-14px)}
}
.logo-container:hover .logo-3d{transform:rotateY(15deg) scale(1.05)}
.glow-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:120%;height:120%;border-radius:50%;background:radial-gradient(circle,rgba(212,168,67,.1) 0%,transparent 70%);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}}
.hero h1{font-family:Georgia,serif;font-size:clamp(28px,6vw,52px);color:var(--gold2);letter-spacing:6px;margin-bottom:10px;text-shadow:0 0 40px rgba(212,168,67,.3)}
.hero p{color:rgba(232,224,208,.5);font-size:clamp(13px,2.5vw,16px);letter-spacing:3px;margin-bottom:40px}
.cta-btn{background:linear-gradient(135deg,var(--gold),#b8902a);color:#0a0a0f;font-size:16px;font-weight:700;padding:14px 40px;border:none;border-radius:50px;cursor:pointer;letter-spacing:1px;transition:all .3s;box-shadow:0 8px 32px rgba(212,168,67,.3)}
.cta-btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(212,168,67,.5)}

/* PARTICLES */
.particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;width:2bgheight:2px;background:var(--gold);border-radius:50%;opacity:0;animation:drift linear infinite}
@keyframes drift{0%opacity:0;transform:translateY(100vh)}10%{opacity:.6}90%{opacity:.6}100%{opacity:0;transform:translateY(-10vh)}}

/* CONTENT PAGES */
.page-content{max-width:1000px;margin:0 auto;padding:30px 20px}
.page-title{font-family:Georgia,serif;font-size:clamp(24px,5vw,36px);color:var(--gold2);text-align:center;margin-bottom:30px;letter-spacing:2px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:linear-gradient(145deg,var(--dark2),var(--dark3));border:1px solid rgba(212,168,67,.12);border-radius:16px;padding:24px;transition:all .3s;cursor:pointer}
.card:hover{transform:translateY(-4px);border-color:rgba(212,168,67,.3);box-shadow:0 12px 40px rgba(0,0,0,.4)}
.card-icon{font-size:36px;margin-bottom:12px}
.card h3{color:var(--gold2);font-size:18px;margin-bottom:8px}
.card p{color:rgba(232,224,208,.5);font-size:14px;line-height:1.5}
.empty-state{text-align:center;padding:80px 20px;color:rgba(232,224,208,.3);font-size:16px}
.empty-state .icon{font-size:60px;margin-bottom:20px;opacity:.4}

/* MOBILE */
@media(max-width:600px){
.tab{padding:8px 12px;font-size:12px}
.nav-logo{font-size:16px}
.card-grid{grid-template-columns:1fr}
}
</style>
</head>
